<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Access to /assess, /team/:token and /report/:token is the URL itself,
         so the path must never travel off-site. This sends only the origin on
         cross-origin requests (images from base44 and wixstatic), never the
         token. Modern browsers already default to this; pinning it means the
         guarantee doesn't depend on a browser default. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.json" />
    <title>Quartz Assessment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
